# Reverse proxy HTTPS cho BitLocker Key Management (mot chung chi cho ca hai cong).
#   443  -> web + JSON API cua app      (server:3000, HTTP trong mang Docker)
#   8443 -> ingest API cho sync worker  (server:8443, HTTP trong mang Docker)
#   80   -> chuyen sang https
# Chung chi: /etc/nginx/cert/server.crt (kem chuoi CA trung gian neu co) va server.key, mount tu ./cert.
# Thay chung chi that: README muc "HTTPS va chung chi".

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time host=$host port=$server_port';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # TLS chung cho ca hai cong
  ssl_certificate           /etc/nginx/cert/server.crt;
  ssl_certificate_key       /etc/nginx/cert/server.key;
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1h;
  ssl_session_tickets       off;

  upstream app_user   { server server:3000; keepalive 16; }
  upstream app_ingest { server server:8443; keepalive 8; }

  # http -> https
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Web + API cua nguoi dung
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # HSTS: dat boi app (Helmet), khong lap lai o day.
    client_max_body_size 1m;

    location / {
      proxy_pass http://app_user;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;   # ghi de: client khong gia duoc IP
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
  }

  # Ingest API cho sync worker: HTTPS + API key (Authorization: Bearer ...) + IP worker (INGEST_ALLOWED_IPS).
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    client_max_body_size 4m;   # lo toi da 500 may / key; server gioi han body 2 MB

    location / {
      proxy_pass http://app_ingest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;   # ghi de: client khong gia duoc IP
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }
  }
}
