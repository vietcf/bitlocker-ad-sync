# Production: cau hinh cua app nam trong server/.env (khong co secret nao ghi cung o day).
#   DB ngoai Docker:  docker compose -f docker-compose.prod.yml up -d --build
#   DB trong Docker:  docker compose -f docker-compose.prod.yml --profile db up -d --build
# May chu khong co internet: tools/build-offline.sh dong goi image thanh mot file (README muc 3.7);
# tren may chu chay them --no-build. BLK_VERSION chon tag cua image app (mac dinh latest).
# Mat khau tao DB lan dau (POSTGRES_PASSWORD...) nam rieng trong server/db.env, chi service db doc;
# app khong thay mat khau superuser. Sau khi DB da khoi tao xong co the xoa server/db.env.
# Xem README muc 3.

x-logging: &logging
  driver: local
  options:
    max-size: "50m"
    max-file: "20"

services:
  # Chi chay khi co --profile db. Mat khau (POSTGRES_PASSWORD, BLK_OWNER_PASSWORD, APP_NODE_PASSWORD,
  # BLK_BACKUP_PASSWORD) lay tu server/db.env; script server/db/init tao cac tai khoan o lan dau.
  db:
    profiles: ["db"]
    image: postgres:17.6
    env_file:
      - path: ./server/db.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: blk
    volumes:
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
      - blk-pg:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "blk"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: ./server
    image: blk-server:${BLK_VERSION:-latest}
    command: ["node", "src/db/migrate.js"]
    env_file: ./server/.env
    restart: "no"
    # DB trong Docker (--profile db): doi DB san sang truoc khi migrate; DB ngoai thi bo qua.
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Thu muc ./backups do Docker tao (root) khi chua co: cap quyen cho user cua app (node) truoc khi server chay,
  # de sao luu ghi duoc ngay ma khong phai chown tay. Chay xong thoat.
  backups-init:
    build: ./server
    image: blk-server:${BLK_VERSION:-latest}
    user: "0:0"
    command: ["sh", "-c", "chown node:node /app/backups && chmod 700 /app/backups"]
    volumes:
      - ./backups:/app/backups
    restart: "no"

  server:
    build: ./server
    image: blk-server:${BLK_VERSION:-latest}
    env_file: ./server/.env
    # Cai dat cua chinh Docker/nginx: ghi de len server/.env (environment thang env_file), de .env sai cung khong
    # lam nginx mat ket noi toi app (loi 502). Chi can dat trong .env: DB, khoa bi mat, IP worker, AD.
    environment:
      NODE_ENV: production
      USER_HOST: 0.0.0.0
      USER_PORT: "3000"
      INGEST_HOST: 0.0.0.0
      INGEST_PORT: "8443"
      TRUST_PROXY: "1"
      INGEST_TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    expose:
      - "3000"
      - "8443"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backups-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      # Cong ra ngoai doi duoc bang HTTPS_PORT, INGEST_PUBLIC_PORT, HTTP_PORT (file .env canh file compose;
      # tools/install.sh --https-port ... ghi giup). Cong trong container giu nguyen.
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDR:-0.0.0.0}:${INGEST_PUBLIC_PORT:-8443}:8443"
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/redirect.conf:/etc/nginx/blk-redirect.conf:ro
      - ./cert:/etc/nginx/cert:ro
    depends_on:
      - server
    restart: unless-stopped
    logging: *logging

volumes:
  blk-pg:
